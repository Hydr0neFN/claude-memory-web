# Drop-in for claude-memory@.service: start only on the node holding the
# writer lease; node-local settings (port, node name, public URL) come from
# node.env, which state sync never copies.
[Service]
# No '+': the gate runs as the unit's User= inside its sandbox. EnvironmentFile
# below applies to every Exec*= line, ExecCondition included, and .env is
# owned by the service user -- as root, a planted BASH_ENV, REPL_CONF or
# LD_PRELOAD there was root code execution (audit 2026-09-26, Critical 2).
# memgate only reads ROLE_FILE and replication.conf, both world-readable.
ExecCondition=/usr/local/sbin/memgate %i
# Optional here so that a standby still waiting for its state files is
# skipped by the gate above rather than failing before the gate runs.
EnvironmentFile=
EnvironmentFile=-/var/lib/claude-memory/%i/.env
EnvironmentFile=-/var/lib/claude-memory/%i/node.env
# The vault's post-commit hook pokes memsync-push@%i.path through this file;
# ProtectSystem=strict would otherwise make it read-only and the push would
# only happen on the retry timer.
ReadWritePaths=-/var/lib/claude-memory/repl/push.%i
# The owner vault's hook also pokes memprotocol-sync.path through this one
# (see memprotocol-sync); on any other instance it is simply not writable.
ReadWritePaths=-/var/lib/claude-memory/repl/protocol-sync
