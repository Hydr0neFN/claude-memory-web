# Drop-in for claude-memory.service (the owner's legacy unit on TW):
# start only on the node holding the writer lease.
[Service]
# No '+': the gate runs as the unit's User= inside its sandbox. The unit's
# EnvironmentFile applies to every Exec*= line, ExecCondition included, and .env is
# owned by the service user -- as root, a planted BASH_ENV, REPL_CONF or
# LD_PRELOAD there was root code execution (audit 2026-09-26, Critical 2).
# memgate only reads ROLE_FILE and replication.conf, both world-readable.
ExecCondition=/usr/local/sbin/memgate yu-i
