<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Memory</title>
<link rel="stylesheet" href="/app.css?v=18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='78' font-size='78'>🧠</text></svg>">
</head>
<body>

<!-- login ---------------------------------------------------------------->
<section id="login" class="login hidden">
  <div class="login-card">
    <h1>Memory</h1>
    <a id="login-google" class="btn primary block hidden" href="/auth/google">Sign in with Google</a>
    <a id="login-github" class="btn primary block hidden" href="/auth/github">Sign in with GitHub</a>
    <p id="login-oauth-note" class="muted small hidden">Second factor comes from
      that account. Only allow-listed addresses can sign in.</p>
    <details id="login-token-wrap" class="login-alt">
      <summary class="muted small">Use the API token instead</summary>
      <form id="login-form" autocomplete="off">
        <input id="login-token" type="password" placeholder="API token" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn">Sign in</button>
      </form>
    </details>
    <p id="login-error" class="error small hidden"></p>
  </div>
</section>

<!-- app ------------------------------------------------------------------>
<div id="app" class="app hidden">

  <header class="topbar">
    <button id="menu-btn" class="btn icon" title="Categories" aria-label="Categories">☰</button>
    <a class="brand" href="#/">🧠 <span>Memory</span></a>
    <form id="search-form" class="search">
      <input id="search-input" type="search" placeholder="Search all categories…" spellcheck="false">
    </form>
    <a class="btn ghost" href="#/pins" title="Retraction and decision markers">Pins<span id="pins-count" class="pill hidden"></span></a>
    <a class="btn ghost" href="#/stale" title="Sections due for a freshness check">Stale</a>
    <div class="newmenu">
      <button id="new-btn" class="btn" title="New category or doc">+ New ▾</button>
      <div id="new-menu" class="dropdown hidden">
        <a href="#/new">Category</a>
        <a href="#/newdoc">Doc</a>
      </div>
    </div>
    <button id="logout-btn" class="btn ghost" title="Sign out">Sign out</button>
  </header>

  <div id="scrim" class="scrim hidden"></div>

  <aside id="sidebar" class="sidebar">
    <input id="filter" class="filter" type="search" placeholder="Filter categories…" spellcheck="false">
    <nav id="catlist" class="catlist"></nav>
    <div id="store-stats" class="store-stats small muted"></div>
  </aside>

  <main id="main" class="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="/md.js?v=18"></script>
<script src="/diff.js?v=18"></script>
<script src="/app.js?v=18"></script>
</body>
</html>
